# Use a modern 256-colour + truecolor terminal default.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"

# Prefix key is Control+t
set -g prefix C-t
bind-key C-t send-prefix
unbind C-b

set-window-option -g xterm-keys on

set -g status-right 'tmux prefix <C-t> #(hostname)'

# Preserve ssh-agent environment
set -g update-environment "SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION"

# Open new panes/windows in the current path
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Start window/pane numbers from 1
set -g base-index 1
set -g pane-base-index 1

# Set window titles
set -g set-titles on

# Quality-of-life
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g mouse on

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Plugins via TPM (fetched by chezmoi into ~/.tmux/plugins/tpm).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
if "test -d ~/.tmux/plugins/tpm" "run '~/.tmux/plugins/tpm/tpm'"
