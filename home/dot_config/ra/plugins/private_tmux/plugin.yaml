name: tmux
version: "1.0.0"
description: "Installs tmux and starts a persistent named session at boot; auto-attaches login shells"
# post_install_message: printed by `ra plugin install`. tmux auto-attach is
# handled entirely workstation-side by profile.d/05-tmux-autoattach.sh (it fires
# on any interactive login shell and carries its own TERM fallback), so there is
# nothing for the user to configure — connect.login_command is not needed, and
# is in fact ignored by `ra plugin et connect` (which runs a login shell).
post_install_message: |
  tmux is installed; a persistent session ("main" by default) starts at boot,
  and interactive logins auto-attach to it automatically — on both `ra connect`
  and `ra plugin et connect`. No connect.login_command is needed for tmux.
config:
  - name: enabled
    type: bool
    description: "Enable tmux plugin?"
    default: false
  - name: session_name
    type: string
    description: "Name of the persistent tmux session"
    default: "main"
  - name: start_directory
    type: string
    description: "Working directory for the tmux session (leave blank for home directory)"
    default: "~"
