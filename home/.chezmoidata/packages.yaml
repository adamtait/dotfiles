# Declarative package manifest. Consumed by the run_onchange package-install scripts.
# Keep tools sorted within each list. Changing any entry re-triggers the installer
# (the scripts hash this data).
packages:
  # Installed on every OS (names valid for both brew and apt where they overlap).
  common:
    - bat
    - fzf
    - gh
    - git
    - htop
    - jq
    - ncdu
    - ripgrep
    - tldr
    - tmux
    - zsh

  darwin:
    # Homebrew formulae
    brew:
      - clojure/tools/clojure
      - coreutils
      - emacs
      - fd
      - fnm
      - git-delta
      - go
      - jj
      - openjdk
      - pyenv
      - rv
      - sqlite
      - starship
      - awscli
      - hashicorp/tap/terraform
      - pulumi/tap/pulumi
      # gcloud-cli + ghostty are casks (see below) but listed via brew bundle too
    # Homebrew casks (GUI / large vendored apps)
    cask:
      - ghostty
      - gcloud-cli
      - hammerspoon
      - font-jetbrains-mono-nerd-font

  linux:
    # Installed with apt (Debian/Ubuntu code-oss workstation)
    apt:
      - build-essential
      - curl
      - emacs-nox
      - fd-find
      - fonts-jetbrains-mono
      - golang-go
      - openjdk-21-jdk
      - unzip
    # Installed with Homebrew-on-Linux for things apt lacks or ships stale
    brew:
      - clojure/tools/clojure
      - fnm
      - git-delta
      - jj
      - pyenv
      - rv
      - starship
      - awscli
      - hashicorp/tap/terraform
      - pulumi/tap/pulumi
